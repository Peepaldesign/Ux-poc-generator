services:
  - type: web
    name: ux-poc-generator
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_FLASH_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_LITE_MODEL
        value: gemini-3.5-flash-lite
      - key: WIREFRAME_MODEL
        value: gemini-3.6-flash
      - key: RPM_SLEEP_SECONDS
        value: "4"
      - key: MAX_WIREFRAME_SCREENS
        value: "5"
