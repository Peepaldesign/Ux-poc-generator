<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UX POC Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --bg-card: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --border: #475569;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Layout */
        .sidebar-history {
            width: 250px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-pipeline {
            width: 300px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* History */
        .history-header { padding: 15px; border-bottom: 1px solid var(--border); font-weight: 600; }
        .history-list { flex: 1; overflow-y: auto; padding: 10px; }
        .history-item { 
            padding: 10px; 
            background: var(--bg-card); 
            margin-bottom: 8px; 
            border-radius: 6px; 
            cursor: pointer;
            font-size: 0.85rem;
            border: 1px solid transparent;
        }
        .history-item:hover { border-color: var(--border); }
        .history-item.active { border-color: var(--accent); }
        .history-item-id { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 4px; }

        /* Controls */
        .input-section { padding: 20px; border-bottom: 1px solid var(--border); }
        .input-box {
            width: 100%;
            height: 100px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            resize: none;
            margin-bottom: 10px;
            font-family: inherit;
        }
        .btn-primary, .btn-danger, .btn-secondary {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .btn-primary { background: var(--accent); }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-danger { background: var(--error); }
        .btn-danger:hover { opacity: 0.9; }
        .btn-secondary { background: var(--bg-card); border: 1px solid var(--border); }
        .btn-secondary:hover { background: #475569; }

        /* Pipeline */
        .pipeline-list { flex: 1; overflow-y: auto; padding: 20px; }
        .agent-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            transition: all 0.2s;
        }
        .agent-card.active { border-color: var(--accent); box-shadow: 0 0 10px rgba(59, 130, 246, 0.2); }
        .agent-status-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            background: var(--bg-dark);
            border: 2px solid var(--border);
        }
        .status-pending .agent-status-icon { border-color: var(--border); }
        .status-running .agent-status-icon { border-color: var(--accent); color: var(--accent); }
        .status-success .agent-status-icon { border-color: var(--success); background: var(--success); color: white; }
        .status-degraded .agent-status-icon { border-color: var(--warning); background: var(--warning); color: white; }
        .status-error .agent-status-icon { border-color: var(--error); background: var(--error); color: white; }
        .status-skipped .agent-status-icon { border-color: var(--text-muted); background: var(--border); color: white; }

        .agent-info { flex: 1; }
        .agent-name { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
        .agent-desc { font-size: 0.75rem; color: var(--text-muted); }

        /* Main View */
        .tab-bar {
            display: flex;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
        }
        .tab {
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            color: var(--text-muted);
            font-weight: 500;
        }
        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: var(--bg-card);
        }
        .tab:hover:not(.active) { color: var(--text-main); }
        
        .view-content {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: var(--bg-dark);
        }
        
        /* Report View */
        .report-section {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .report-section h2 { margin-bottom: 15px; color: var(--accent); font-size: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 8px;}
        .report-section h3 { margin: 15px 0 10px 0; font-size: 1.05rem; color: var(--text-main); }
        
        /* Utility styles for report content */
        .metric-card { background: var(--bg-card); padding: 10px; border-radius: 6px; margin-bottom: 10px; }
        .tag { display: inline-block; padding: 2px 8px; background: var(--bg-card); border-radius: 12px; font-size: 0.75rem; margin: 2px; }
        table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.85rem; }
        th, td { padding: 8px; text-align: left; border: 1px solid var(--border); }
        th { background: var(--bg-card); }
        ul { margin-left: 20px; margin-bottom: 10px; font-size: 0.9rem; }
        
        /* Download Bar */
        .download-bar {
            padding: 15px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .download-note { font-size: 0.8rem; color: var(--text-muted); margin-left: auto; }

        /* JSON Inspector */
        pre {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 0.85rem;
            color: #d4d4d4;
        }
        
        /* Hi-Fi Screen Cards CSS */
        .hifi-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; overflow: hidden; }
        .hifi-card-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-card); }
        .hifi-card-title { font-weight: 600; font-size: 0.9rem; }
        .hifi-card-meta { font-size: 0.75rem; color: var(--text-muted); }
        .hifi-card-actions { display: flex; gap: 8px; align-items: center; }
        .hifi-card-actions button { padding: 4px 12px; font-size: 0.78rem; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); }
        .hifi-card-actions button:hover { background: var(--accent); border-color: var(--accent); }
        .hifi-card-actions button:disabled { opacity: 0.5; cursor: not-allowed; }
        .hifi-card-actions select { padding: 4px 8px; font-size: 0.78rem; border-radius: 4px; background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); }
        .hifi-iframe-wrapper { background: #ffffff; min-height: 200px; position: relative; }
        .hifi-iframe-wrapper iframe { width: 100%; border: none; min-height: 600px; }
        .hifi-placeholder { padding: 40px; text-align: center; color: var(--text-muted); }
        .hifi-error { padding: 15px; background: rgba(239, 68, 68, 0.1); color: var(--error); border-radius: 0; font-size: 0.85rem; }
        .hifi-notes { padding: 10px 16px; font-size: 0.78rem; color: var(--text-muted); border-top: 1px solid var(--border); font-style: italic; }
        .ds-token-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; font-size: 0.85rem; }
        .ds-token { background: var(--bg-card); padding: 10px; border-radius: 6px; }
        .ds-token-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
        .ds-token-value { font-weight: 500; }
        
        /* Phase Inspector Select */
        .phase-select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            background: var(--bg-card);
            color: white;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <button id="btn-expand-history" style="display: none; position: absolute; left: 0; top: 10px; background: var(--bg-card); color: white; border: 1px solid var(--border); padding: 5px; cursor: pointer; border-radius: 0 4px 4px 0; z-index: 100;">▶ History</button>
    <div class="sidebar-history" id="sidebar-history">
        <div class="history-header">
    History
    <button id="btn-collapse-history" style="float: right; background: none; border: none; color: var(--text-muted); cursor: pointer;">◀</button>
</div>
        <div class="history-list" id="history-list">
            <!-- Populated by JS -->
        </div>
    </div>

    <div class="sidebar-pipeline">
        <div class="input-section">
            <textarea id="brief-input" class="input-box" placeholder="Enter product brief (e.g. 'A mobile app for dog walkers to connect with owners')"></textarea>
            <button id="btn-generate" class="btn-primary">Generate POC</button>
            <button id="btn-stop" class="btn-danger" style="display: none;">Stop</button>
        </div>
        <div class="pipeline-list" id="pipeline-list">
            <!-- Populated by JS -->
        </div>
    </div>

    <div class="main-content">
        <div class="tab-bar">
            <div class="tab active" data-tab="report">📄 Full Report</div>
            <div class="tab" data-tab="hifi">🎨 Hi-Fi Screens</div>
            <div class="tab" data-tab="inspector">🔍 Phase Inspector</div>
        </div>

        <div id="download-bar" class="download-bar" style="display: none;">
            <button id="btn-dl-md" class="btn-secondary" style="width: auto;">Download Markdown</button>
            <button id="btn-dl-pdf" class="btn-secondary" style="width: auto;">Download PDF</button>
            <button id="btn-dl-json" class="btn-secondary" style="width: auto;">Download JSON</button>
            <span class="download-note">Export uses 0 LLM tokens</span>
        </div>

        <div class="view-content" id="view-report">
            <div style="color: var(--text-muted); text-align: center; margin-top: 50px;">
                Run a generation or select a job from history.
            </div>
        </div>

        <div class="view-content" id="view-hifi" style="display: none;">
            <div id="hifi-controls" style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <div>
                    <button id="btn-generate-all-hifi" class="btn-primary" style="width: auto; padding: 10px 20px;" disabled>Generate All Screens</button>
                    <span id="hifi-status-text" style="font-size: 0.8rem; color: var(--text-muted); margin-left: 10px;">Requires completed report</span>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button id="btn-dl-tokens-json" class="btn-secondary" style="width: auto; padding: 6px 12px; font-size: 0.8rem;" disabled>⬇ Design Tokens JSON</button>
                    <button id="btn-dl-tokens-css" class="btn-secondary" style="width: auto; padding: 6px 12px; font-size: 0.8rem;" disabled>⬇ CSS Variables</button>
                </div>
            </div>
            <div id="design-system-summary" style="display:none; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 20px;">
                <h3 style="margin-bottom: 10px; color: var(--accent);">🎨 Design System</h3>
                <div id="design-system-content"></div>
            </div>
            <div id="hifi-screen-list"></div>
        </div>
        
        <div class="view-content" id="view-inspector" style="display: none;">
            <select id="inspector-select" class="phase-select">
                <!-- Populated by JS -->
            </select>
            <pre id="inspector-json">{}</pre>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
